<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Test</h1>
    <div id="status">Disconnected</div>
    <div id="log" style="white-space: pre-wrap; font-family: monospace; height: 400px; overflow: auto; border: 1px solid #ccc; padding: 10px;"></div>
    
    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(msg) {
            const time = new Date().toISOString();
            log.textContent += `[${time}] ${msg}\n`;
            log.scrollTop = log.scrollHeight;
        }
        
        const ws = new WebSocket('ws://localhost:8080/ws?user_id=999&username=testuser&room_id=1');
        
        ws.onopen = () => {
            status.textContent = 'Connected';
            status.style.color = 'green';
            addLog('Connected!');
            
            // Send join message
            ws.send(JSON.stringify({ type: 'join', room_id: '1', user_id: 999, username: 'testuser' }));
            addLog('Sent: join message');
        };
        
        ws.onmessage = (event) => {
            addLog(`Received: ${event.data}`);
            
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'ping') {
                    ws.send(JSON.stringify({ type: 'pong' }));
                    addLog('Sent: pong');
                }
            } catch (e) {
                addLog(`Parse error: ${e}`);
            }
        };
        
        ws.onerror = (error) => {
            addLog(`Error: ${error}`);
        };
        
        ws.onclose = (event) => {
            status.textContent = 'Disconnected';
            status.style.color = 'red';
            addLog(`Closed: code=${event.code}, reason=${event.reason}`);
        };
        
        // Send ping every 25 seconds
        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
                addLog('Sent: ping');
            }
        }, 25000);
    </script>
</body>
</html>
