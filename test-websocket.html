<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #059669;
        }
        button.disconnect {
            background: #ef4444;
        }
        button.disconnect:hover {
            background: #dc2626;
        }
        #log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #666;
            padding-left: 10px;
        }
        .log-success { border-color: #10b981; color: #10b981; }
        .log-error { border-color: #ef4444; color: #ef4444; }
        .log-info { border-color: #3b82f6; color: #3b82f6; }
        .log-message { border-color: #f59e0b; color: #f59e0b; }
        input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            width: 200px;
            margin: 5px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.connected {
            background: #10b981;
            color: white;
        }
        .status.disconnected {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Connection Test</h1>
        
        <div>
            <h3>Connection Settings</h3>
            <label>User ID: <input type="number" id="userId" value="1"></label><br>
            <label>Username: <input type="text" id="username" value="testuser"></label><br>
            <label>Room ID: <input type="text" id="roomId" value="1"></label><br>
            <label>WebSocket URL: <input type="text" id="wsUrl" value="ws://localhost:8080" style="width: 300px;"></label>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="connect()">Connect</button>
            <button class="disconnect" onclick="disconnect()">Disconnect</button>
            <button onclick="sendPing()">Send Ping</button>
            <button onclick="sendJoin()">Send Join</button>
            <button onclick="clearLog()">Clear Log</button>
            <span class="status disconnected" id="status">Disconnected</span>
        </div>

        <div id="log"></div>
    </div>

    <script>
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status connected';
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
            }
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('Already connected', 'info');
                return;
            }

            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const roomId = document.getElementById('roomId').value;
            const wsUrl = document.getElementById('wsUrl').value;

            const url = `${wsUrl}/ws?user_id=${userId}&username=${encodeURIComponent(username)}&room_id=${roomId}`;
            
            log(`Connecting to: ${url}`, 'info');

            try {
                ws = new WebSocket(url);

                ws.onopen = () => {
                    log('✅ WebSocket connected successfully!', 'success');
                    updateStatus(true);
                    reconnectAttempts = 0;
                    
                    // Send join message
                    sendJoin();
                };

                ws.onclose = (event) => {
                    log(`❌ WebSocket closed: code=${event.code}, reason=${event.reason || 'No reason provided'}`, 'error');
                    updateStatus(false);
                    
                    if (event.code !== 1000 && reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
                        log(`Reconnecting in ${delay}ms (attempt ${reconnectAttempts}/${maxReconnectAttempts})...`, 'info');
                        setTimeout(connect, delay);
                    }
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error.message || 'Unknown error'}`, 'error');
                    console.error('WebSocket error:', error);
                };

                ws.onmessage = (event) => {
                    log(`📨 Received: ${event.data}`, 'message');
                    try {
                        const data = JSON.parse(event.data);
                        log(`   Type: ${data.type}, Payload: ${JSON.stringify(data.payload || {})}`, 'message');
                    } catch (e) {
                        log(`   (Could not parse as JSON)`, 'message');
                    }
                };

            } catch (error) {
                log(`❌ Failed to create WebSocket: ${error.message}`, 'error');
                console.error('Connection error:', error);
            }
        }

        function disconnect() {
            if (!ws) {
                log('No active connection', 'info');
                return;
            }

            const userId = document.getElementById('userId').value;
            const roomId = document.getElementById('roomId').value;

            // Send leave message
            if (ws.readyState === WebSocket.OPEN) {
                const leaveMsg = {
                    type: 'leave',
                    room_id: roomId,
                    user_id: parseInt(userId)
                };
                ws.send(JSON.stringify(leaveMsg));
                log(`📤 Sent leave message`, 'info');
            }

            ws.close(1000, 'User disconnected');
            ws = null;
            updateStatus(false);
            log('Disconnected', 'info');
        }

        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Not connected', 'error');
                return;
            }

            const msg = { type: 'ping' };
            ws.send(JSON.stringify(msg));
            log(`📤 Sent: ${JSON.stringify(msg)}`, 'info');
        }

        function sendJoin() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('❌ Not connected', 'error');
                return;
            }

            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const roomId = document.getElementById('roomId').value;

            const msg = {
                type: 'join',
                room_id: roomId,
                user_id: parseInt(userId),
                username: username
            };
            ws.send(JSON.stringify(msg));
            log(`📤 Sent: ${JSON.stringify(msg)}`, 'info');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-connect on load
        window.onload = () => {
            log('WebSocket Test Tool Ready', 'success');
            log('Click "Connect" to start testing', 'info');
        };

        // Clean up on page unload
        window.onbeforeunload = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close(1000, 'Page unload');
            }
        };
    </script>
</body>
</html>
