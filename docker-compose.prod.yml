version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker123}
      POSTGRES_DB: ${POSTGRES_DB:-poker_arena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poker-network

  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poker-backend
    restart: unless-stopped
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      # Discrete connection settings (the backend reads these, not *_URL).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-poker_arena}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT_SECRET MUST be a strong value; compose will error if unset.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required in production}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTE: the runtime image is built FROM scratch and has no shell or curl,
    # so a command-based container healthcheck cannot run inside it. Use an
    # external HTTP probe (e.g. Kubernetes liveness/readiness probes) against
    # /healthz (liveness) and /readyz (readiness) instead.
    networks:
      - poker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    container_name: poker-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - poker-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  poker-network:
    driver: bridge
